apiVersion: v1
kind: ConfigMap
metadata:
  name: projectpulse-config
  namespace: projectpulse
data:
  APP_NAME: "ProjectPulse"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://projectpulse.local"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"
  DB_CONNECTION: "pgsql"
  DB_HOST: "projectpulse-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "projectpulse"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"
  SESSION_DRIVER: "database"
  ALLOW_PUBLIC_REGISTRATION: "false"
  CORS_ALLOWED_ORIGINS: "http://projectpulse.local"
  AI_PROVIDER: "openai"
  AI_TIMEOUT_SECONDS: "20"
  AI_DEMO_FALLBACK_ENABLED: "false"
  OPENAI_MODEL: "gpt-4o-mini"
  GEMINI_MODEL: "gemini-2.0-flash"
