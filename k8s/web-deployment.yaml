apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectpulse-web
  namespace: projectpulse
  labels:
    app.kubernetes.io/name: projectpulse-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: projectpulse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectpulse-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: projectpulse-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
